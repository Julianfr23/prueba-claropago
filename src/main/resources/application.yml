spring:
  application:
    name: conciliacion-pagos
  datasource:
    # H2 en modo Oracle: solo para ejecucion local y pruebas. Ver application-oracle.yml para Oracle real.
    url: jdbc:h2:mem:pagoclaro;MODE=Oracle;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo gobiernan los scripts de db/, nunca Hibernate
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/schema/01_base_schema.sql
        - classpath:db/schema/02_integrity_and_indexes.sql

logging:
  level:
    com.pagoclaro: INFO
